# AuraFit — Nginx Development Config (Stage 10: Full Service Routing)
# Routes all services behind a single port 80 in local development.

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Upstreams ─────────────────────────────────────────────────────────────
    upstream user_service          { server user-service:8001;           keepalive 16; }
    upstream recommendation_service{ server recommendation-service:8003; keepalive 16; }
    upstream facial_analysis       { server facial-analysis:8010;        keepalive 8;  }
    upstream virtual_tryon         { server virtual-tryon:8020;          keepalive 8;  }
    upstream frontend              { server web:3000;                    keepalive 16; }

    # ── Rate limiting ─────────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_zone:10m  rate=100r/m;
    limit_req_zone $binary_remote_addr zone=ai_zone:10m   rate=20r/m;

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 20M;

        # ── User Service (auth, users, profiles, chat, color, style-dna) ──────
        location /api/v1/auth/ {
            limit_req zone=auth_zone burst=10 nodelay;
            proxy_pass         http://user_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location ~ ^/api/v1/(users|profiles|preferences|sessions|mfa|analysis|uploads|chat|color|style-dna|wardrobes|health)/ {
            proxy_pass         http://user_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            # SSE support for chat streaming
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 300s;
        }

        # ── Recommendation Service ─────────────────────────────────────────────
        location /rec-api/ {
            limit_req zone=api_zone burst=20 nodelay;
            rewrite ^/rec-api/(.*)$ /$1 break;
            proxy_pass         http://recommendation_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        # ── Facial Analysis AI ─────────────────────────────────────────────────
        location /ai-api/ {
            limit_req zone=ai_zone burst=5 nodelay;
            rewrite ^/ai-api/(.*)$ /$1 break;
            proxy_pass         http://facial_analysis;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 60s;
            client_max_body_size 15M;
        }

        # ── Virtual Try-On ────────────────────────────────────────────────────
        location /vtryon-api/ {
            limit_req zone=ai_zone burst=5 nodelay;
            rewrite ^/vtryon-api/(.*)$ /$1 break;
            proxy_pass         http://virtual_tryon;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 60s;
            client_max_body_size 15M;
        }

        # ── Next.js frontend (HMR WebSocket in dev) ───────────────────────────
        location /_next/webpack-hmr {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location / {
            proxy_pass         http://frontend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }
    }
}
