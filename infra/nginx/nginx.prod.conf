# AuraFit — Nginx production configuration.
# SSL termination, strict rate limiting, security headers.
# TLS certificates managed by ACM / Let's Encrypt (external to this config).

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # ── Upstreams ─────────────────────────────────────────────────────────────
    upstream user_service {
        server user-service:8001;
        keepalive 64;
    }

    # (Add product-service, recommendation-service etc. as they are implemented)

    # ── Rate limiting zones ───────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=auth_limit:20m    rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:20m     rate=60r/m;
    limit_req_zone $binary_remote_addr zone=ai_limit:20m      rate=10r/m;
    limit_req_zone $binary_remote_addr zone=global_limit:20m  rate=120r/m;

    # ── Connection limiting ───────────────────────────────────────────────────
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ── Logging ───────────────────────────────────────────────────────────────
    log_format json_prod escape=json
        '{"ts":"$time_iso8601","method":"$request_method","uri":"$request_uri",'
        '"status":$status,"upstream":"$upstream_addr",'
        '"rt":"$request_time","bytes":$body_bytes_sent,'
        '"ip":"$http_x_forwarded_for","ua":"$http_user_agent"}';

    access_log /var/log/nginx/access.log json_prod buffer=32k flush=5s;
    error_log  /var/log/nginx/error.log  warn;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    client_max_body_size 10M;
    client_body_timeout 30s;
    client_header_timeout 10s;
    send_timeout 60s;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types application/json text/plain application/javascript;

    # ── Hide server version ───────────────────────────────────────────────────
    server_tokens off;

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name api.aurafit.ai;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS API server ──────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name api.aurafit.ai;

        # TLS (certificate paths depend on deployment; ACM handles this on EKS)
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # ── Security headers ───────────────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;

        # ── Auth endpoints ─────────────────────────────────────────────────────
        location /api/v1/auth/ {
            limit_req   zone=auth_limit burst=10 nodelay;
            limit_req_status 429;
            limit_conn  conn_limit 10;

            proxy_pass         http://user_service;
            proxy_http_version 1.1;
            proxy_set_header   Connection         "";
            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $scheme;
            proxy_read_timeout 30s;
        }

        # ── AI/Analysis endpoints (stricter rate limit) ──────────────────────
        location ~ ^/api/v1/(analysis|uploads)/ {
            limit_req   zone=ai_limit burst=5 nodelay;
            limit_req_status 429;

            proxy_pass         http://user_service;
            proxy_http_version 1.1;
            proxy_set_header   Connection         "";
            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $scheme;
            proxy_read_timeout 120s;   # AI tasks can take longer
        }

        # ── SSE endpoints (chat streaming) ────────────────────────────────────
        location ~ ^/api/v1/chat/sessions/.*/messages$ {
            limit_req   zone=api_limit burst=5 nodelay;

            proxy_pass         http://user_service;
            proxy_http_version 1.1;
            proxy_set_header   Connection         "";
            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $scheme;

            # SSE-specific: disable buffering
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 300s;
            add_header         X-Accel-Buffering  no;
        }

        # ── General API ────────────────────────────────────────────────────────
        location /api/ {
            limit_req   zone=api_limit burst=20 nodelay;
            limit_conn  conn_limit 20;

            proxy_pass         http://user_service;
            proxy_http_version 1.1;
            proxy_set_header   Connection         "";
            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $scheme;
            proxy_read_timeout 60s;
        }

        # ── Health probes (no rate limit, no auth) ────────────────────────────
        location ~ ^/(health|ready)$ {
            proxy_pass http://user_service;
            access_log off;
            proxy_read_timeout 5s;
        }

        # ── Block everything else ──────────────────────────────────────────────
        location / {
            return 404;
        }
    }
}
